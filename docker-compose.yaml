x-peekchimp-build: &peekchimp-build
  context: .
  dockerfile: Dockerfile
  args:
    VITE_APP_NAME: ${VITE_APP_NAME:-Peekchimp}

x-peekchimp-runtime: &peekchimp-runtime
  APP_NAME: ${APP_NAME:-Peekchimp}
  APP_ENV: ${APP_ENV:-production}
  APP_KEY: ${APP_KEY:?APP_KEY is required}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: ${APP_URL:?APP_URL is required}
  LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE:-peekchimp}
  DB_USERNAME: ${DB_USERNAME:-peekchimp}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
  REDIS_DB: ${REDIS_DB:-0}
  REDIS_CACHE_DB: ${REDIS_CACHE_DB:-1}
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  SESSION_ENCRYPT: ${SESSION_ENCRYPT:-true}
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
  QUEUE_CONNECTION: redis
  REDIS_QUEUE_CONNECTION: default
  REDIS_QUEUE: ${REDIS_QUEUE:-default}
  REDIS_QUEUE_RETRY_AFTER: ${REDIS_QUEUE_RETRY_AFTER:-180}

services:
  app:
    build: *peekchimp-build
    restart: unless-stopped
    env_file: .env
    environment: *peekchimp-runtime
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - geoip-data:/var/www/html/storage/app/private/geoip
    command: >-
      sh -lc "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8000/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  horizon:
    build: *peekchimp-build
    restart: unless-stopped
    env_file: .env
    environment: *peekchimp-runtime
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: php artisan horizon
    stop_grace_period: 90s

  scheduler:
    build: *peekchimp-build
    restart: unless-stopped
    env_file: .env
    environment: *peekchimp-runtime
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - geoip-data:/var/www/html/storage/app/private/geoip
    command: php artisan schedule:work

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-peekchimp}
      POSTGRES_USER: ${DB_USERNAME:-peekchimp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-peekchimp} -d ${DB_DATABASE:-peekchimp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: >-
      sh -c 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep PONG
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  geoip-data:
  postgres-data:
  redis-data:
